service: emlyon-middleware-api

provider:
  name: aws
  runtime: nodejs20.x
  stage: dev
  region: eu-west-3
  memorySize: 256
  timeout: 30
  environment:
    NODE_ENV: production
    ALLOWED_ORIGINS: ${env:ALLOWED_ORIGINS}
    AZURE_TENANT_ID: ${env:AZURE_TENANT_ID}
    AZURE_CLIENT_ID: ${env:AZURE_CLIENT_ID}
    AZURE_CLIENT_SECRET: ${env:AZURE_CLIENT_SECRET}
    AZURE_SCOPE: ${env:AZURE_SCOPE}
    AZURE_TOKEN_TIMEOUT_MS: ${env:AZURE_TOKEN_TIMEOUT_MS, '15000'}
    EMLYON_SCORES_URL: ${env:EMLYON_SCORES_URL}
    EMLYON_API_URL: ${env:EMLYON_API_URL}
    EMLYON_SCORES_PATH: ${env:EMLYON_SCORES_PATH, '/services/resultats_mereos'}
    EMLYON_API_TIMEOUT_MS: ${env:EMLYON_API_TIMEOUT_MS, '15000'}

functions:
  api:
    handler: lambda.handler
    events:
      - http:
          path: /
          method: ANY
          cors: true
      - http:
          path: /{proxy+}
          method: ANY
          cors: true
